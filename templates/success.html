<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration Successful</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #edf7f1; color: #18352a; font-family: Inter, system-ui, sans-serif; }
    main { width: min(92vw, 620px); background: white; padding: 42px; border-radius: 18px; box-shadow: 0 18px 50px rgba(24,53,42,.12); text-align: center; }
    .check { width: 64px; height: 64px; display: grid; place-items: center; margin: auto; border-radius: 50%; background: #daf3e4; color: #147a43; font-size: 34px; }
    h1 { margin-bottom: 8px; }
    dl { display: grid; grid-template-columns: 1fr 2fr; text-align: left; gap: 10px 18px; margin: 28px 0; }
    dt { font-weight: 700; } dd { margin: 0; }
    a { color: #1463d6; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="check">✓</div>
    <h1>Registration successful</h1>
    <p>The student record was saved to private RDS storage and the photo was uploaded to private S3 storage.</p>
    <dl>
      <dt>Name</dt><dd>{{ name }}</dd>
      <dt>Email</dt><dd>{{ email }}</dd>
      <dt>Course</dt><dd>{{ course }}</dd>
    </dl>
    <p><a href="{{ photo_url }}" target="_blank" rel="noopener">Open uploaded photo</a></p>
    <p><a href="/">Register another student</a></p>
  </main>
</body>
</html>
