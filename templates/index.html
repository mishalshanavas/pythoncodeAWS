<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef3f8; color: #172033; }
    main { width: min(92vw, 620px); background: white; padding: 42px; border-radius: 18px; box-shadow: 0 18px 50px rgba(23,32,51,.12); }
    .eyebrow { color: #1463d6; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
    h1 { margin: 8px 0 10px; font-size: 32px; }
    p { color: #5c667a; margin: 0 0 28px; }
    label { display: block; font-weight: 650; margin: 18px 0 7px; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #cbd4e1; border-radius: 9px; font: inherit; }
    input:focus { outline: 3px solid #d8e8ff; border-color: #1463d6; }
    button { width: 100%; margin-top: 26px; padding: 13px; border: 0; border-radius: 9px; color: white; background: #1463d6; font: inherit; font-weight: 750; cursor: pointer; }
    small { display: block; margin-top: 16px; color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">AWS Cloud Deployment Project</div>
    <h1>Student Registration</h1>
    <p>Register a student and securely store the submitted photo.</p>
    <form action="/register" method="post" enctype="multipart/form-data">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" required>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required>
      <label for="course">Course</label>
      <input id="course" name="course" type="text" required>
      <label for="photo">Student photo</label>
      <input id="photo" name="photo" type="file" accept="image/*" required>
      <button type="submit">Register student</button>
      <small>EC2 application · Private RDS · Private S3</small>
    </form>
  </main>
</body>
</html>
